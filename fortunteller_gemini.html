<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 포춘텔러</title>
    <style>
        /* 신비로운 컨셉의 배경과 폰트 설정 */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            background: linear-gradient(135deg, #1a0b2e, #4b1d52);
            color: #f8e9a1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 메인 컨테이너 디자인 */
        .container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(248, 233, 161, 0.2);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        /* 입력칸 디자인 */
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #8e44ad;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        /* 버튼 디자인 */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            background: linear-gradient(to right, #8e44ad, #9b59b6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
        }

        button:hover {
            background: linear-gradient(to right, #9b59b6, #8e44ad);
            transform: scale(1.02);
        }

        /* 결과 출력 영역 디자인 */
        #resultArea {
            margin-top: 30px;
            padding: 20px;
            background-color: rgba(248, 233, 161, 0.1);
            border: 1px dashed #f8e9a1;
            border-radius: 8px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
            font-size: 16px;
            word-break: keep-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ 나만의 포춘텔러 ✨</h1>

        <div class="input-group">
            <label for="userName">이름</label>
            <input type="text" id="userName" placeholder="이름을 입력해 주세요">
        </div>

        <div class="input-group">
            <label for="userBirth">생년월일</label>
            <input type="date" id="userBirth">
        </div>

        <div class="button-group">
            <button onclick="showResult('today')">오늘의 운세 보기</button>
            <button onclick="showResult('wealth')">재물운 보기</button>
            <button onclick="showResult('personality')">성향 파악하기</button>
        </div>

        <div id="resultArea">
            운세를 확인할 테마를 선택해 주세요.
        </div>
    </div>

    <script>
        // 1. 오늘의 운세 데이터 (랜덤)
        const todayFortunes = [
            "🔮 오늘은 뜻밖의 귀인을 만날 수 있는 날입니다.",
            "🔮 계획했던 일이 술술 풀리는 기분 좋은 하루네요!",
            "🔮 작은 미소가 큰 행운을 불러오는 날입니다. 웃어보세요!",
            "🔮 잠시 쉬어가는 여유가 필요한 하루입니다.",
            "🔮 새로운 도전이 성공으로 이어질 가능성이 높습니다.",
            "🔮 주변 사람들에게 감사함을 표현하면 좋은 일이 생깁니다.",
            "🔮 잃어버렸던 물건을 찾거나 반가운 소식을 듣게 됩니다.",
            "🔮 오늘 하루는 당신이 주인공입니다. 자신감을 가지세요!",
            "🔮 예상치 못한 곳에서 즐거움을 발견할 수 있습니다.",
            "🔮 평범한 일상 속에서 특별한 행복을 느끼는 날입니다."
        ];

        // 2. 재물운 데이터 (랜덤)
        const wealthFortunes = [
            "💰 금전운이 상승하고 있습니다. 좋은 기회를 잡아보세요!",
            "💰 오늘은 지출을 조금 줄이고 저축에 신경 쓰면 좋습니다.",
            "💰 생각지도 못한 곳에서 용돈이나 보너스가 들어올 수 있어요.",
            "💰 누군가에게 베푼 만큼 재물로 돌아오는 하루입니다.",
            "💰 충동구매를 조심하세요! 꼭 필요한 것만 사는 지혜가 필요합니다.",
            "💰 투자나 재테크에 대한 새로운 정보를 얻게 될 수 있습니다.",
            "💰 지갑이 두둑해지는 기분 좋은 소식이 기다리고 있습니다.",
            "💰 작은 돈이라도 소중히 여기면 큰 재물이 되어 돌아옵니다.",
            "💰 오늘은 재물운이 평온합니다. 안정적인 관리가 최고입니다.",
            "💰 당신의 노력과 땀방울이 곧 금전적인 보상으로 이어집니다."
        ];

        // 3. 성향 파악 데이터 (월별 12개)
        const personalityTraits = [
            "🌟 1월생: 책임감이 강하고 목표를 향해 묵묵히 나아가는 끈기 있는 성향입니다.",
            "🌟 2월생: 창의적이고 독창적인 아이디어가 넘치며 자유를 사랑합니다.",
            "🌟 3월생: 따뜻한 마음씨를 가졌으며 타인의 감정에 공감하는 능력이 뛰어납니다.",
            "🌟 4월생: 열정적이고 에너지가 넘치며 새로운 도전을 두려워하지 않습니다.",
            "🌟 5월생: 안정감을 중요하게 생각하며 신중하고 믿음직스러운 성격입니다.",
            "🌟 6월생: 호기심이 많고 소통 능력이 뛰어나 주변에 항상 사람이 많습니다.",
            "🌟 7월생: 감수성이 풍부하고 가족과 친구를 끔찍이 아끼는 다정한 사람입니다.",
            "🌟 8월생: 리더십이 강하고 자신감이 넘치며 어디서나 빛나는 존재입니다.",
            "🌟 9월생: 꼼꼼하고 분석적이며 완벽을 추구하는 지적인 성향을 가졌습니다.",
            "🌟 10월생: 조화와 균형을 중시하며 뛰어난 미적 감각과 사교성을 자랑합니다.",
            "🌟 11월생: 통찰력이 깊고 비밀스러우며 한 번 마음먹은 일은 끝까지 해냅니다.",
            "🌟 12월생: 낙천적이고 모험을 즐기며 긍정적인 에너지로 주변을 밝게 합니다."
        ];

        // 결과를 화면에 보여주는 함수
        function showResult(type) {
            const nameInput = document.getElementById('userName').value;
            const birthInput = document.getElementById('userBirth').value;
            const resultArea = document.getElementById('resultArea');

            // 완료 기준 1: 이름이나 생년월일이 비어있으면 경고창 띄우기
            if (!nameInput || !birthInput) {
                alert("정보를 입력해 주세요");
                return;
            }

            let resultText = "";

            // 테마에 따른 결과 생성
            if (type === 'today') {
                // 랜덤으로 오늘의 운세 선택
                const randomIndex = Math.floor(Math.random() * todayFortunes.length);
                resultText = todayFortunes[randomIndex];
            } 
            else if (type === 'wealth') {
                // 랜덤으로 재물운 선택
                const randomIndex = Math.floor(Math.random() * wealthFortunes.length);
                resultText = wealthFortunes[randomIndex];
            } 
            else if (type === 'personality') {
                // YYYY-MM-DD 형식에서 월(MM)만 추출
                const monthString = birthInput.split('-')[1]; 
                const monthNumber = parseInt(monthString, 10); // 숫자로 변환 (1~12)
                
                // 배열은 0부터 시작하므로 월에서 1을 빼서 인덱스로 사용
                resultText = personalityTraits[monthNumber - 1];
            }

            // 완료 기준 2 & 추가 기능: 새로고침 없이 결과 영역 업데이트
            resultArea.innerHTML = `<strong>${nameInput}</strong>님의 결과<br><br>${resultText}`;
        }
    </script>
</body>
</html>
